include:
  - docker-compose.yml
  - immich/docker-compose.yml
  - tubearchivist/docker-compose.yml
  - matomo/docker-compose.yml
  - hermes-agent/docker-compose.yml
  # Observability stack (prometheus, loki, alloy, grafana, cadvisor) — comment out
  # this one line to disable the whole stack; config lives in observability/.
  - observability/docker-compose.yml
  - gatus/docker-compose.yml
  - glance/docker-compose.yml
  - dynacat/docker-compose.yml
  - homepage/docker-compose.yml
  # archivebox disabled 2026-08-21 — largest memory consumer on the host (~1.8 GB RSS;
  # it runs a headless Chrome for page snapshotting) while the VM was thrashing: swap
  # fully exhausted, load average 127. Re-enable by uncommenting the include below; the
  # service definition and the ~/docker-volumes/archivebox data are left untouched.
  # - archivebox/docker-compose.yml
  - kafka/docker-compose.yml
  - redis-pubsub/docker-compose.yml
  - forgejo/docker-compose.yml
  - path: penpot/docker-compose.yml
    env_file: penpot/.env
  - path: planka/docker-compose.yml
    env_file: planka/.env
  # Both files are listed: navidrome/.env holds NAVIDROME_MUSIC_DIR, but naming an
  # env_file replaces the default .env lookup, so the shared .env has to be listed
  # explicitly too or ${TZ} would resolve to empty.
  - path: navidrome/docker-compose.yml
    env_file:
      - .env
      - navidrome/.env
  - path: linkwarden/docker-compose.yml
    env_file:
      - .env
      - linkwarden/.env

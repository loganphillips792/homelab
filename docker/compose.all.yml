include:
  - docker-compose.yml
  - immich/docker-compose.yml
  - tubearchivist/docker-compose.yml
  - matomo/docker-compose.yml
  - hermes-agent/docker-compose.yml
  - archivebox/docker-compose.yml
  - redis-pubsub/docker-compose.yml
  - path: penpot/docker-compose.yml
    env_file: penpot/.env
  - path: planka/docker-compose.yml
    env_file: planka/.env
  # Both files are listed: navidrome/.env holds NAVIDROME_MUSIC_DIR, but naming an
  # env_file replaces the default .env lookup, so the shared .env has to be listed
  # explicitly too or ${TZ} would resolve to empty.
  - path: navidrome/docker-compose.yml
    env_file:
      - .env
      - navidrome/.env

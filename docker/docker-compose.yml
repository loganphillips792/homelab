  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "5000:80"
    networks:
      - main-network

  drawio:
    image: jgraph/drawio:latest
    container_name: drawio
    restart: unless-stopped
    ports:
      - "8080:8080" # exposed on localhost for testing; caddy also proxies internally
    environment:
      # The app's own public base URL (trailing slash), used for generated share/viewer/embed
      # links -- NOT for access. localhost:8080 works via the port mapping above regardless.
      # Override only if you want those generated links to point at localhost during testing:
      #   DRAWIO_SERVER_URL=http://localhost:8080/ docker compose up -d drawio
      - DRAWIO_SERVER_URL=${DRAWIO_SERVER_URL:-http://drawio.homelab/}
    networks:
      - main-network

  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    # ports:
    #   - "5000:5000"  # Exposed via Caddy; internal only
    volumes:
      - datastore-volume:/datastore
    restart: unless-stopped
    networks:
      - main-network

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    # ports:
    #   - "7869:11434"  # Exposed via Caddy; internal only
    volumes:
      - ~/docker-volumes/ollama/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    tty: true
    pull_policy: always
    restart: unless-stopped
    networks:
      - main-network

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-webui
    # ports:
    #   - "8080:8080"  # Exposed via Caddy; internal only
    volumes:
      - ~/docker-volumes/ollama/ollama-webui:/app/backend/data
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URLS=http://ollama:11434
      - ENV=dev
      - WEBUI_AUTH=False
      - WEBUI_NAME=valiantlynx AI
      - WEBUI_URL=http://ollama-webui.homelab
      - WEBUI_SECRET_KEY=t0p-s3cr3t
    restart: unless-stopped
    networks:
      - main-network

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # user: "1000:1000"
    volumes:
      - ~/docker-volumes/jellyfin/config:/config
      - ~/docker-volumes/jellyfin/cache:/cache
      # Music library, mounted read-only so Jellyfin can never modify the files.
      # Set JELLYFIN_MUSIC_DIR in docker/.env -- on the VM that's the SSD at
      # /mnt/ssd/music (see "Changing the mount path" in README.md). The host path
      # must already be mounted BEFORE the container is created: a bind mount
      # resolves its source once, and docker silently creates a missing source as
      # an empty dir rather than failing, so the library shows up empty.
      - ${JELLYFIN_MUSIC_DIR:-~/docker-volumes/jellyfin/music}:/media/music:ro
      # Movie library, same rules. Also on the SSD, so it's covered by the same
      # /mnt/ssd fstab entry -- and it goes stale on a remount for the same reason.
      - ${JELLYFIN_MOVIES_DIR:-~/docker-volumes/jellyfin/movies}:/media/movies:ro
      # Additional libraries: add more mounts under /media, one per content type.
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /usr/local/share/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://example.com
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "8096:8096"
    networks:
      - main-network

  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    platform: linux/x86_64 # to fix error: no matching manifest for linux/arm64/v8 in the manifest list entries
    container_name: pinchflat
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "8945:8945"
    volumes:
      - ~/docker-volumes/pinchflat/config:/config
      - ~/docker-volumes/pinchflat/downloads:/downloads
    networks:
      - main-network


  flame:
    image: pawelmalak/flame
    container_name: flame
    restart: unless-stopped
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "5005:5005"
    environment:
      - PASSWORD=${FLAME_PASSWORD}
    volumes:
      - ~/docker-volumes/flame:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - main-network



  test-db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: test_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./test-db-init.sql:/docker-entrypoint-initdb.d/10-test-table.sql:ro

# https://github.com/loganphillips792/live-auction
  live-auction:
    image: dockedupstream/live-auction:latest
    restart: unless-stopped
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "80:80"
    env_file:
      - path: live-auction/.env
        required: false
    environment:
      - OTEL_SERVICE_NAME=live-auction-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=tempo:4317 # Removed http://
      - ENABLE_PROMETHEUS=true
    volumes:
      - ./live-auction/db:/app/backend/db
      - ./live-auction/logs:/app/backend/logs
    networks:
      - main-network
    # depends_on: # Ensure backend starts after tempo is available
    #   - tempo


  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - ./caddy/site:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - main-network
      - kafka-network
  
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TZ}
    volumes:
      - ~/docker-volumes/backrest/data:/data
      - ./backrest/config:/config
      - ./backrest/cache:/cache
      - ./backrest/tmp:/tmp
      - ./backrest/rclone:/root/.config/rclone
      - ${BACKREST_USERDATA:-/Users/logan/docker-volumes}:/userdata
      - ${BACKREST_REPOS:-/Users/logan/repos}:/repos
    networks:
      - main-network

  cta-map:
    image: dockedupstream/cta-map:latest
    container_name: cta-map
    restart: unless-stopped
    env_file:
      - path: ./cta-map/compose.env
        required: false
    environment:
      - PORT=8080
    volumes:
      - ~/docker-volumes/cta-map:/app/data:ro
    networks:
      - main-network


volumes:
  kafka-data:
  db_storage:
  n8n_storage:
  pihole_etc:
  uptime_kuma_data:
  metabase-db-data:
  umami-db-data:
  postgres_test_data:
  caddy_data:
  caddy_config:
  redis_data:
  redisinsight_data:
  datastore-volume:
  komodo-mongo-data:
  komodo-mongo-config:
  netdataconfig:
  netdatalib:
  netdatacache:
  karakeep-meilisearch:
  karakeep-data:
  paperless-ngx-data:
  paperless-ngx-media:
  paperless-ngx-pgdata:
  paperless-ngx-redisdata:

networks:
  kafka-network:
    driver: bridge
  main-network:
    driver: bridge

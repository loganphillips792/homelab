services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: tailscale
    environment:
      # Generate a reusable auth key: login.tailscale.com -> Settings -> Keys
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-tags=tag:container --advertise-routes=10.0.0.0/24 --accept-routes
    volumes:
      - ~/docker-volumes/tailscale/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
  postgres: # For N8N
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - main-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - N8N_SECURE_COOKIE=False
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - 5678:5678
    links:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main-network
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # Unique ID for this broker
      KAFKA_NODE_ID: 1

      # Cluster ID (generate once: `uuidgen`)
      KAFKA_CLUSTER_ID: "q1Sh-8BCRyKf-9pgaJ0Z2w"

      # Listeners - Separate listeners for internal and external access
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      
      # Advertised listeners - Internal for container communication, External for localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      # Storage directories (logs = Kafka data, not app logs)
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft mode settings - Fixed controller quorum voters
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Inter-broker listener - Use PLAINTEXT for container communication
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Security settings for controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Auto-create topics settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - 8080:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      # Use internal listener for container-to-container communication
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-network
      - main-network
  
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    restart: unless-stopped
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            homelab-kafka:
              properties:
                # Use existing Kafka broker from the main stack
                bootstrap.servers: "kafka:29092"
              # Uncomment if you later add Schema Registry
              # schema-registry:
              #   url: "http://schema-registry:8085"
    # No host ports; Caddy will reverse-proxy
    networks:
      - main-network
      - kafka-network
  
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - 8083:8080
    networks:
      - main-network

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "80:80/tcp" commented out because caddy uses these
      # - "443:443/tcp"
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD}
      - FTLCONF_dns_listeningMode=all
      #- FTLCONF_dns_domain=homelab
      - FTLCONF_misc_etc_dnsmasq_d=true
    volumes:
      - ~/docker-volumes/pihole-config/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped
    networks:
      - main-network


  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    # Do not publish host ports; Caddy will proxy internally
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase-db
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - main-network

  metabase-db:
    image: postgres:16-alpine
    container_name: metabase_db
    hostname: metabase-db
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - main-network
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    # Do not publish host port 3000 to avoid conflict with Grafana
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      umami-db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - main-network

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - main-network
  cronmaster:
    image: ghcr.io/fccview/cronmaster:latest
    container_name: cronmaster
    user: "root"
    ports:
      - "40123:3000"
    environment:
      NODE_ENV: production
      DOCKER: "true"
      NEXT_PUBLIC_CLOCK_UPDATE_INTERVAL: 30000
      AUTH_PASSWORD: very_strong_password
      HOST_CRONTAB_USER: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/docker-volumes/cronmaster/scripts:/app/scripts
      - ~/docker-volumes/cronmaster/data:/app/data
      - ~/docker-volumes/cronmaster/snippets:/app/snippets
    pid: "host"
    privileged: true
    restart: always
    init: true
    networks:
      - main-network
  jotty:
    image: ghcr.io/fccview/jotty:latest
    container_name: jotty
    user: "1000:1000"
    ports:
      - "1122:3000"
    volumes:
      - ~/docker-volumes/jotty/data:/app/data:rw
      - ./jotty/config:/app/config:rw
      - ~/docker-volumes/jotty/cache:/app/.next/cache:rw
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - main-network

  uptime-kuma:
    image: louislam/uptime-kuma:2.0.2
    container_name: uptime-kuma
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "3002:3001" # 3001 is used by homepage on host
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    networks:
      - main-network # so that uptime kuma can reach out to other services

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kafka-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "5540:5540"
    volumes:
      - redisinsight_data:/data
    environment:
      - RI_APP_PORT=5540
      - RI_APP_HOST=0.0.0.0
      - RI_ENCRYPTION_KEY=${RI_ENCRYPTION_KEY}
      - RI_LOG_LEVEL=info
      - RI_FILES_LOGGER=true
      - RI_STDOUT_LOGGER=true
      - RI_ACCEPT_TERMS_AND_CONDITIONS=true
      - RI_DATABASE_MANAGEMENT=true
      # Preconfigure a Redis connection (ID defaults to 0 when omitted)
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=Primary Redis
      - RI_REDIS_USERNAME=default
      - RI_REDIS_PASSWORD=${REDIS_PASSWORD}
      - RI_REDIS_TLS=false
      - RI_REDIS_DB=0
    depends_on:
      - redis
    networks:
      - main-network

  paperless-ngx-broker:
    image: docker.io/library/redis:8
    container_name: paperless-ngx-broker
    restart: unless-stopped
    volumes:
      - paperless-ngx-redisdata:/data
    networks:
      - main-network

  paperless-ngx-db:
    image: docker.io/library/postgres:18
    container_name: paperless-ngx-db
    restart: unless-stopped
    volumes:
      - paperless-ngx-pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    networks:
      - main-network

  paperless-ngx-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx-webserver
    restart: unless-stopped
    depends_on:
      - paperless-ngx-db
      - paperless-ngx-broker
    # ports:
    #   - "8000:8000"  # Exposed via Caddy; internal only
    volumes:
      - paperless-ngx-data:/usr/src/paperless/data
      - paperless-ngx-media:/usr/src/paperless/media
      - ./paperless-ngx/export:/usr/src/paperless/export
      - ./paperless-ngx/consume:/usr/src/paperless/consume
    env_file: ./paperless-ngx/docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://paperless-ngx-broker:6379
      PAPERLESS_DBHOST: paperless-ngx-db
    networks:
      - main-network

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ~/docker-volumes/beszel/beszel_data:/beszel_data
      - ~/docker-volumes/beszel/beszel_socket:/beszel_socket
    networks:
      - main-network
  ## Runs on each system you want to monitor and communicates system metrics to the hub.
  ## DISABLED 2026-08-20 — the agent had never once connected and was in a permanent
  ## crash-restart loop (9235 restarts): `failed to parse key: changeMe`.
  ## The hub had never been set up either — its data.db has zero rows in users,
  ## systems, fingerprints and universal_tokens, so no TOKEN could ever have existed.
  ## BESZEL_KEY in .env is now the hub's real public key (recovered from its private
  ## key on disk), but BESZEL_TOKEN is still changeMe.
  ## To re-enable: browse to http://beszel.homelab:8090, create the admin user, then
  ## Add System -> copy the generated token into BESZEL_TOKEN, then uncomment.
  # beszel-agent:

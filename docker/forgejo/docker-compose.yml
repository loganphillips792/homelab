# Forgejo (self-hosted git forge, a Gitea fork) at http://forgejo.homelab.
#
# One container, no database container: with no FORGEJO__database__* variables set,
# Forgejo falls back to SQLite, which lives inside the same /data directory as the repos
# and config. That keeps the whole service to a single directory to back up.
#
# Storage is a bind mount like upstream's ./forgejo:/data, but under ~/docker-volumes (as
# homarr, matomo, etc. do) rather than inside the repo checkout, so repos and the database
# can't end up committed. Note backup-remote-volumes.sh only tars named volumes, so it does
# not cover this directory. Upstream's /etc/localtime:/etc/localtime:ro mount is replaced
# by the shared ${TZ} from docker/.env.
#
# No web port is published. Host 3000 is already linkwarden's, and Caddy reaches this
# container over main-network anyway (forgejo:3000). SSH does need a real host port,
# since git clients connect to the host directly rather than through Caddy.
#
# main-network is declared in the root docker-compose.yml, not here -- like the other
# per-service files in this repo, this only comes up via compose.all.yml:
#   docker compose -f compose.all.yml up -d forgejo
# No forgejo/.env: with SQLite there are no secrets to hold.
# Docs: https://forgejo.org/docs/latest/admin/installation/installation-docker/

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    environment:
      # Ownership of /data inside the container; the entrypoint chowns to match.
      - USER_UID=1000
      - USER_GID=1000
      - TZ=${TZ}
      # FORGEJO__<section>__<KEY> variables are rendered into /data/gitea/conf/app.ini on
      # every start, so these stay authoritative even after the install wizard writes it.
      - FORGEJO__server__DOMAIN=forgejo.homelab
      # Generated links/redirects use this. To test over localhost:3014:
      #   FORGEJO_ROOT_URL=http://localhost:3014/ docker compose up -d forgejo
      - FORGEJO__server__ROOT_URL=${FORGEJO_ROOT_URL:-http://forgejo.homelab/}
      - FORGEJO__server__SSH_DOMAIN=forgejo.homelab
      # The reachable host port, not the container's 22. Without it Forgejo advertises
      # clone URLs on 22, which nothing can reach.
      - FORGEJO__server__SSH_PORT=222
    ports:
      - "222:22" # git-over-SSH
      - "3014:3000" # web UI exposed on localhost for testing (3000 is linkwarden's); caddy also proxies internally
    volumes:
      # Repos, config and the SQLite database all live under here. Must be owned by
      # USER_UID:USER_GID (1000:1000) or the container may not start.
      - ~/docker-volumes/forgejo:/data
    networks:
      - main-network

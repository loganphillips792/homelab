​# Monitors for all services routed through Caddy (see docker/caddy/Caddyfile).
# Using the .homelab URLs means each check exercises the full user path:
# DNS (pihole) -> Caddy -> service. Gatus itself is not monitored (it can't
# report its own downtime); uptime-kuma covers that.
#
# Services with a dedicated health endpoint use it; everything else is a GET /
# expecting a 200 (redirects are followed).

endpoints:
  # --- Infrastructure ---
  - name: Pi-hole
    group: infrastructure
    url: http://pihole.homelab/admin/
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: Komodo
    group: infrastructure
    url: http://komodo.homelab
    interval: 60s
    conditions:
      - "[STATUS] == 200"

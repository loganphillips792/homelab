# Gatus — uptime checks for every service routed through Caddy.
# Endpoint definitions live in ./config/config.yaml.
#
# Paths are relative to THIS directory — Compose resolves relative paths in an
# included file against the included file's own location, not docker/.
# main-network is declared in ../docker-compose.yml and merges project-wide.

services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: unless-stopped
    # Resolve *.homelab via Pi-hole (port 53 published on the host). Docker's
    # embedded DNS forwards to the host's upstream resolvers, which don't know
    # the .homelab zone, so without this every check fails DNS.
    dns: 192.168.1.150
    ports:
      - 8082:8080
    volumes:
      - ./config:/config
    networks:
      - main-network

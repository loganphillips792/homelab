# Mosquitto 2.x only listens on localhost until a listener is declared, so without this
# file neither Home Assistant nor Zigbee2MQTT could connect.
listener 1883

# The password file is not in this directory: the mosquitto service's command rebuilds
# it from MQTT_USER / MQTT_PASSWORD (docker/.env) on every start. See ../docker-compose.yml.
allow_anonymous false
password_file /mosquitto/data/passwd

# Keep retained messages (device state, Home Assistant discovery payloads) across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout

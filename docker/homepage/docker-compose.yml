# Homepage — service dashboard. Config in ./config.
#
# Paths are relative to THIS directory — Compose resolves relative paths in an
# included file against the included file's own location, not docker/.
# main-network is declared in ../docker-compose.yml and merges project-wide.

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "3001:3000" # Grafana uses 3000 on host
    volumes:
      - ./config:/app/config # Ensure this local dir exists
      - ~/docker-volumes/homepage-logs:/app/config/logs # don't want logs to be committed into the repo
      - /var/run/docker.sock:/var/run/docker.sock # Optional: for Docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: localhost:3001,homepage.homelab
    restart: unless-stopped
    networks:
      - main-network

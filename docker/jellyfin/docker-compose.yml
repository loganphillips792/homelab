# Jellyfin (media server for the music, movie and TV show libraries) at http://jellyfin.homelab.
#
# main-network is declared in the root docker-compose.yml, not here -- like the other
# per-service files in this repo, this only comes up via compose.all.yml:
#   docker compose -f compose.all.yml up -d jellyfin
# No jellyfin/.env: JELLYFIN_MUSIC_DIR / JELLYFIN_MOVIES_DIR / JELLYFIN_TVSHOWS_DIR come
# from the shared docker/.env (VM paths under /mnt/ssd). To run on the Mac against
# /Volumes/SSD, override them in the shell -- see "Running through docker compose"
# in README.md.

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # user: "1000:1000"
    volumes:
      - ~/docker-volumes/jellyfin/config:/config
      - ~/docker-volumes/jellyfin/cache:/cache
      # Music library, mounted read-only so Jellyfin can never modify the files.
      # Set JELLYFIN_MUSIC_DIR in docker/.env -- on the VM that's the SSD at
      # /mnt/ssd/music (see "Changing the mount path" in README.md). The host path
      # must already be mounted BEFORE the container is created: a bind mount
      # resolves its source once, and docker silently creates a missing source as
      # an empty dir rather than failing, so the library shows up empty.
      - ${JELLYFIN_MUSIC_DIR:-~/docker-volumes/jellyfin/music}:/media/music:ro
      # Movie library. Writable so Jellyfin can save downloaded subtitles next to the
      # videos, which needs the SSD to be ext4. Also on the SSD, so it's covered by the
      # same /mnt/ssd fstab entry -- and it goes stale on a remount for the same reason.
      - ${JELLYFIN_MOVIES_DIR:-~/docker-volumes/jellyfin/movies}:/media/movies
      # TV show library, writable for the same reason. Kept separate from movies because
      # Jellyfin scans each library with a single content type (Movies vs Shows).
      - ${JELLYFIN_TVSHOWS_DIR:-~/docker-volumes/jellyfin/tvshows}:/media/tvshows
      # Additional libraries: add more mounts under /media, one per content type.
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /usr/local/share/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=http://example.com
    # Jellyfin shares tailscale-jellyfin's network stack, so it can't have its own
    # ports/networks -- those live on the sidecar below.
    network_mode: service:tailscale-jellyfin
    depends_on:
      - tailscale-jellyfin

  # Tailscale sidecar: puts Jellyfin on the tailnet as its own machine ("jellyfin",
  # http://jellyfin:8096), so it can be shared with people outside the tailnet
  # (admin console -> Machines -> jellyfin -> Share). Node sharing doesn't carry the
  # main tailscale container's subnet routes, which is why this needs its own node.
  # Uses the same reusable TS_AUTHKEY as the main tailscale container in docker/.env.
  tailscale-jellyfin:
    image: tailscale/tailscale:latest
    container_name: tailscale-jellyfin
    hostname: jellyfin
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=jellyfin
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ~/docker-volumes/tailscale-jellyfin/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    ports:
      - "8096:8096" # exposed on localhost for testing; caddy also proxies internally
    networks:
      main-network:
        # Caddy, homepage and uptime-kuma reach Jellyfin as jellyfin:8096 -- this
        # alias keeps that name resolving now that the sidecar owns the network.
        aliases:
          - jellyfin

# Observability stack: metrics (prometheus), logs (loki), collection (alloy),
# container metrics (cadvisor), and visualization (grafana).
#
# Kill switch: comment out the `observability/docker-compose.yml` include in
# compose.all.yml to disable the whole stack at once (~3 GB RSS on the VM).
#
# Paths below are relative to THIS directory, not docker/ — Compose resolves
# relative paths in an included file against the included file's own location.
# That's why alloy/, grafana/, prometheus/ and loki/ live in here alongside it.
#
# main-network is declared in ../docker-compose.yml and merges project-wide, so
# it is referenced but not redeclared here (same as immich/ and matomo/ do).

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports: # don't need ports because caddy proxies to the container ports for us
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - main-network

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.enable-remote-write-receiver'
    networks:
      - main-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    user: "0"
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - main-network
    restart: unless-stopped


  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    ports:
      - "12345:12345"  # Alloy UI
    user: "0"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      - HOSTNAME
    networks:
      - main-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    # ports: # don't need ports because caddy proxies to the container ports for us
    #   - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - main-network
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

# Named volumes keep their docker_* project prefix because include: merges every
# file into the one `docker` project — moving these declarations here does not
# rename or recreate them.
volumes:
  prometheus_data:
  loki_data:
  grafana_data:

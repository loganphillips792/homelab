# Wildcard: archivebox.homelab + all subdomains (admin./web./api./snap-*.) resolve
# to the host. ArchiveBox subdomain-routing mode (safe-subdomains-fullreplay) needs
# the per-snapshot snap-<hash>. labels, which only a wildcard can cover.
address=/archivebox.homelab/192.168.1.130


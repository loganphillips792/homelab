# Seerr (media request manager; the project formerly called Jellyseerr) at http://seerr.homelab.
# Users browse and request movies/shows; Seerr checks them against the Jellyfin library.
#
# Config (SQLite DB + settings.json) is the seerr_config named volume, deliberately NOT a
# ~/docker-volumes bind mount -- same reason as navidrome_data: SQLite's locking breaks on a
# Docker Desktop (VirtioFS) bind mount. A named volume is also created with the image's own
# ownership, so the node user (UID 1000) can write to it without a chown, and
# backup-remote-volumes.sh covers it.
#
# A new named volume gets a copy of the image's /app/config/DOCKER marker file, which makes Seerr
# show a false "volume mount was not configured properly" banner. Delete it once per new volume:
#   docker exec seerr rm /app/config/DOCKER && docker compose -f compose.all.yml restart seerr
#
# main-network is declared in the root docker-compose.yml, not here -- like the other
# per-service files in this repo, this only comes up via compose.all.yml:
#   docker compose -f compose.all.yml up -d seerr

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "5055:5055" # exposed on localhost for testing; caddy also proxies internally
    volumes:
      - seerr_config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    networks:
      - main-network

volumes:
  seerr_config:
